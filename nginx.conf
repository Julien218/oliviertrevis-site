worker_processes 1;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # ── Détection domaine ────────────────────────────────────────────────────────
  map $http_host $site_target {
    "letourdedour.com"       "letourdedour";
    "www.letourdedour.com"   "letourdedour";
    "assurances-dour.be"     "assurances";
    "www.assurances-dour.be" "assurances";
    default                  "oliviertrevis";
  }

  server {
    listen ${PORT};
    root /app/dist;
    index index.html;

    # ── letourdedour.com → sert letourdedour.html sur TOUTES les routes ──────
    location / {
      add_header Cache-Control "no-cache, no-store, must-revalidate";

      if ($site_target = "letourdedour") {
        return 301 https://www.oliviertrevis.be/tour-de-dour;
      }

      if ($site_target = "assurances") {
        rewrite ^ /assurances-dour.html last;
      }

      try_files $uri $uri/ /index.html;
    }

    # ── Assets avec hash → cache long (immutable) ────────────────────────────
    location ~* ^/assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # ── Pages statiques directes ─────────────────────────────────────────────
    location = /letourdedour.html   { try_files /letourdedour.html =404; }
    location = /assurances-dour.html { try_files /assurances-dour.html =404; }
    location = /mascotte.html       { try_files /mascotte.html =404; }
    location = /jytrixai-og.html    { try_files /jytrixai-og.html =404; }
    location = /jsinnovia-og.html   { try_files /jsinnovia-og.html =404; }
    location = /fabiano-og.html     { try_files /fabiano-og.html =404; }
    location = /unesco-og.html      { try_files /unesco-og.html =404; }
    location = /miss-mister-og.html { try_files /miss-mister-og.html =404; }
    location = /tour-de-dour-og.html { try_files /tour-de-dour-og.html =404; }
    location = /synergie-dour.html  { try_files /synergie-dour.html =404; }

    # ── Pages React avec OG redirect pour bots ───────────────────────────────
    location = /jytrixai {
      if ($http_user_agent ~* "(facebookexternalhit|Facebot|WhatsApp|Twitterbot|LinkedInBot|TelegramBot|Slackbot|redditbot|Applebot|bingbot|Googlebot)") {
        rewrite ^ /jytrixai-og.html last;
      }
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      try_files $uri /index.html;
    }
    location = /jsinnovia {
      if ($http_user_agent ~* "(facebookexternalhit|Facebot|WhatsApp|Twitterbot|LinkedInBot|TelegramBot|Slackbot|redditbot|Applebot|bingbot|Googlebot)") {
        rewrite ^ /jsinnovia-og.html last;
      }
      try_files $uri /index.html;
    }
    location = /fabiano {
      if ($http_user_agent ~* "(facebookexternalhit|Facebot|WhatsApp|Twitterbot|LinkedInBot|TelegramBot|Slackbot|redditbot|Applebot|bingbot|Googlebot)") {
        rewrite ^ /fabiano-og.html last;
      }
      try_files $uri /index.html;
    }
    location = /unesco {
      if ($http_user_agent ~* "(facebookexternalhit|Facebot|WhatsApp|Twitterbot|LinkedInBot|TelegramBot|Slackbot|redditbot|Applebot|bingbot|Googlebot)") {
        rewrite ^ /unesco-og.html last;
      }
      try_files $uri /index.html;
    }
    location = /miss-mister-dour {
      if ($http_user_agent ~* "(facebookexternalhit|Facebot|WhatsApp|Twitterbot|LinkedInBot|TelegramBot|Slackbot|redditbot|Applebot|bingbot|Googlebot)") {
        rewrite ^ /miss-mister-og.html last;
      }
      try_files $uri /index.html;
    }
    location = /tour-de-dour {
      if ($http_user_agent ~* "(facebookexternalhit|Facebot|WhatsApp|Twitterbot|LinkedInBot|TelegramBot|Slackbot|redditbot|Applebot|bingbot|Googlebot)") {
        rewrite ^ /tour-de-dour-og.html last;
      }
      try_files $uri /index.html;
    }
    location = /synergie-dour {
      if ($http_user_agent ~* "(facebookexternalhit|Facebot|WhatsApp|Twitterbot|LinkedInBot|TelegramBot|Slackbot|redditbot|Applebot|bingbot|Googlebot)") {
        rewrite ^ /synergie-dour.html last;
      }
      try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
  }
}