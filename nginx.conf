worker_processes 1;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  server {
    listen ${PORT} default_server;
    root /app/dist;
    index index.html;

    # ── DEBUG : endpoint pour voir le Host header ────────────────────────────
    location = /debug-host {
      add_header Content-Type "application/json" always;
      add_header Cache-Control "no-cache" always;
      return 200 '{"http_host":"$http_host","host":"$host","server_name":"$server_name","scheme":"$scheme"}';
    }

    # ── Redirection letourdedour.com ─────────────────────────────────────────
    set $is_letourdedour 0;
    if ($http_host ~* "letourdedour") {
      set $is_letourdedour 1;
    }
    if ($is_letourdedour = 1) {
      return 301 https://www.oliviertrevis.be/tour-de-dour;
    }

    # ── assurances-dour.be ───────────────────────────────────────────────────
    set $is_assurances 0;
    if ($http_host ~* "assurances-dour") {
      set $is_assurances 1;
    }

    location / {
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      if ($is_assurances = 1) {
        rewrite ^ /assurances-dour.html last;
      }
      try_files $uri $uri/ /index.html;
    }

    location ~* ^/assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    location = /assurances-dour.html { try_files /assurances-dour.html =404; }
    location = /mascotte.html        { try_files /mascotte.html =404; }
    location = /jsinnovia-og.html    { try_files /jsinnovia-og.html =404; }
    location = /fabiano-og.html      { try_files /fabiano-og.html =404; }
    location = /unesco-og.html       { try_files /unesco-og.html =404; }
    location = /miss-mister-og.html  { try_files /miss-mister-og.html =404; }
    location = /tour-de-dour-og.html { try_files /tour-de-dour-og.html =404; }
    location = /synergie-dour.html   { try_files /synergie-dour.html =404; }

      add_header Cache-Control "no-cache, no-store, must-revalidate";
      try_files $uri /index.html;
    }
    location = /jsinnovia {
      if ($http_user_agent ~* "(facebookexternalhit|Facebot|WhatsApp|Twitterbot|LinkedInBot|TelegramBot|Slackbot|redditbot|Applebot|bingbot|Googlebot)") {
        rewrite ^ /jsinnovia-og.html last;
      }
      try_files $uri /index.html;
    }
    location = /fabiano {
      if ($http_user_agent ~* "(facebookexternalhit|Facebot|WhatsApp|Twitterbot|LinkedInBot|TelegramBot|Slackbot|redditbot|Applebot|bingbot|Googlebot)") {
        rewrite ^ /fabiano-og.html last;
      }
      try_files $uri /index.html;
    }
    location = /unesco {
      if ($http_user_agent ~* "(facebookexternalhit|Facebot|WhatsApp|Twitterbot|LinkedInBot|TelegramBot|Slackbot|redditbot|Applebot|bingbot|Googlebot)") {
        rewrite ^ /unesco-og.html last;
      }
      try_files $uri /index.html;
    }
    location = /miss-mister-dour {
      if ($http_user_agent ~* "(facebookexternalhit|Facebot|WhatsApp|Twitterbot|LinkedInBot|TelegramBot|Slackbot|redditbot|Applebot|bingbot|Googlebot)") {
        rewrite ^ /miss-mister-og.html last;
      }
      try_files $uri /index.html;
    }
    location = /tour-de-dour {
      if ($http_user_agent ~* "(facebookexternalhit|Facebot|WhatsApp|Twitterbot|LinkedInBot|TelegramBot|Slackbot|redditbot|Applebot|bingbot|Googlebot)") {
        rewrite ^ /tour-de-dour-og.html last;
      }
      try_files $uri /index.html;
    }
    location = /synergie-dour {
      if ($http_user_agent ~* "(facebookexternalhit|Facebot|WhatsApp|Twitterbot|LinkedInBot|TelegramBot|Slackbot|redditbot|Applebot|bingbot|Googlebot)") {
        rewrite ^ /synergie-dour.html last;
      }
      try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
  }
}
