worker_processes 1;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  server {
    listen ${PORT};
    root /app/dist;
    index index.html;

    # Servir mascotte.html directement SANS redirection
    location = /mascotte.html {
      try_files /mascotte.html =404;
    }

    # /fabiano — servir fabiano-og.html aux crawlers FB/WhatsApp, SPA aux humains
    location = /fabiano {
      if ($http_user_agent ~* "(facebookexternalhit|Facebot|WhatsApp|Twitterbot|LinkedInBot|TelegramBot|Slackbot|redditbot|Applebot|bingbot|Googlebot)") {
        rewrite ^ /fabiano-og.html last;
      }
      try_files $uri /index.html;
    }

    # Servir fabiano-og.html directement pour les crawlers
    location = /fabiano-og.html {
      try_files /fabiano-og.html =404;
    }

    # /unesco — servir unesco.html aux crawlers (bonne preview WhatsApp/Facebook)
    location = /unesco {
      if ($http_user_agent ~* "(facebookexternalhit|Facebot|WhatsApp|Twitterbot|LinkedInBot|TelegramBot|Slackbot|redditbot|Applebot|bingbot|Googlebot)") {
        rewrite ^ /unesco.html last;
      }
      try_files $uri /index.html;
    }

    # Servir unesco.html directement pour les crawlers
    location = /unesco.html {
      try_files /unesco.html =404;
    }

    # SPA fallback — toutes les autres routes → index.html React
    location / {
      try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
  }
}
