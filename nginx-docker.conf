    location = /canari-og.html { try_files /canari-og.html =404; }

    location = /renard {
        if ($http_user_agent ~* "(facebookexternalhit|Facebot|WhatsApp|Twitterbot|LinkedInBot|TelegramBot|Slackbot|redditbot|Applebot|bingbot|Googlebot)") {
            rewrite ^ /renard-og.html last;
        }
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri /index.html;
    }
    location = /renard-og.html { try_files /renard-og.html =404; }

    location = /ours {
        if ($http_user_agent ~* "(facebookexternalhit|Facebot|WhatsApp|Twitterbot|LinkedInBot|TelegramBot|Slackbot|redditbot|Applebot|bingbot|Googlebot)") {
            rewrite ^ /ours-og.html last;
        }
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri /index.html;
    }
    location = /ours-og.html { try_files /ours-og.html =404; }

    location = /biche {
        if ($http_user_agent ~* "(facebookexternalhit|Facebot|WhatsApp|Twitterbot|LinkedInBot|TelegramBot|Slackbot|redditbot|Applebot|bingbot|Googlebot)") {
