server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    resolver 1.1.1.1 8.8.8.8 valid=300s;

    # Proxy des appels backend Base44 (fonctions) — nécessaire pour /mascottes,
    # les votes, et tout ce qui appelle window.location.origin + "/functions/..."
    location /functions/ {
        proxy_pass https://site-olivier-6b051d5a.base44.app;
        proxy_set_header Host site-olivier-6b051d5a.base44.app;
        proxy_ssl_server_name on;
        proxy_ssl_name site-olivier-6b051d5a.base44.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store";
    }

    location ~* ^/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files /index.html =404;
    }

    location = /fabiano {
        if ($http_user_agent ~* "(facebookexternalhit|Facebot|WhatsApp|Twitterbot|LinkedInBot|TelegramBot|Slackbot|redditbot|Applebot|bingbot|Googlebot)") {
            rewrite ^ /fabiano-og.html last;
        }
        try_files $uri /index.html;
    }
    location = /fabiano-og.html { try_files /fabiano-og.html =404; }

    location = /unesco {
        # Servir directement la landing page UNESCO (HTML statique autonome)
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /unesco.html =404;
    }
    location = /unesco.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /unesco.html =404;
    }

    location = /miss-mister-dour {
        if ($http_user_agent ~* "(facebookexternalhit|Facebot|WhatsApp|Twitterbot|LinkedInBot|TelegramBot|Slackbot|redditbot|Applebot|bingbot|Googlebot)") {
            rewrite ^ /miss-mister-og.html last;
        }
        try_files $uri /index.html;
    }
    location = /miss-mister-og.html { try_files /miss-mister-og.html =404; }

    location = /tour-de-dour {
        if ($http_user_agent ~* "(facebookexternalhit|Facebot|WhatsApp|Twitterbot|LinkedInBot|TelegramBot|Slackbot|redditbot|Applebot|bingbot|Googlebot)") {
            rewrite ^ /tour-de-dour-og.html last;
        }
        try_files $uri /index.html;
    }
    location = /tour-de-dour-og.html { try_files /tour-de-dour-og.html =404; }


    location = /lion {
        if ($http_user_agent ~* "(facebookexternalhit|Facebot|WhatsApp|Twitterbot|LinkedInBot|TelegramBot|Slackbot|redditbot|Applebot|bingbot|Googlebot)") {
            rewrite ^ /lion-og.html last;
        }
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri /index.html;
    }
    location = /lion-og.html { try_files /lion-og.html =404; }

    location = /canari {
        if ($http_user_agent ~* "(facebookexternalhit|Facebot|WhatsApp|Twitterbot|LinkedInBot|TelegramBot|Slackbot|redditbot|Applebot|bingbot|Googlebot)") {
            rewrite ^ /canari-og.html last;
