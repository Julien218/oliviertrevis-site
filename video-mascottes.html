<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tour de Dour — Mascotte</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Arial Black', sans-serif;
    overflow: hidden;
  }

  /* ── Format 9:16 vertical ── */
  #stage {
    width: 390px;
    height: 692px;
    position: relative;
    overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 0 60px rgba(212,175,55,0.3);
  }

  canvas#bg { position: absolute; inset: 0; z-index: 0; }

  .scene {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.6s ease;
    z-index: 2;
  }
  .scene.active { opacity: 1; }

  /* ══ SCÈNE 1 ══ */
  #s1 { background: radial-gradient(ellipse at center, #1a0533 0%, #000 70%); }

  .mascots-img {
    width: 320px;
    animation: float 3s ease-in-out infinite;
    filter: drop-shadow(0 0 30px rgba(212,175,55,0.5));
    z-index: 3;
  }

  @keyframes float {
    0%,100% { transform: translateY(0px) scale(1); }
    50%      { transform: translateY(-12px) scale(1.02); }
  }

  .s1-text {
    position: absolute;
    bottom: 100px;
    left: 0; right: 0;
    text-align: center;
    padding: 0 20px;
  }

  .s1-title {
    font-family: 'Arial Black', sans-serif;
    font-size: 22px;
    font-weight: 900;
    color: #fff;
    line-height: 1.25;
    text-shadow: 0 0 30px rgba(212,175,55,0.8), 0 2px 8px rgba(0,0,0,0.9);
    animation: pulseText 2s ease-in-out infinite;
  }

  .s1-title span { color: #D4AF37; }

  @keyframes pulseText {
    0%,100% { text-shadow: 0 0 20px rgba(212,175,55,0.6), 0 2px 8px rgba(0,0,0,0.9); }
    50%      { text-shadow: 0 0 50px rgba(212,175,55,1), 0 0 80px rgba(124,58,237,0.5), 0 2px 8px rgba(0,0,0,0.9); }
  }

  /* ══ SCÈNE 2 ══ */
  #s2 { background: linear-gradient(160deg, #0f0035 0%, #1a0a4a 40%, #001a2e 100%); }

  .confetti-container {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }

  .mascots-dance {
    width: 330px;
    animation: dance 0.5s ease-in-out infinite alternate;
    filter: drop-shadow(0 0 20px rgba(6,182,212,0.4));
    z-index: 3;
    margin-top: -40px;
  }

  @keyframes dance {
    0%   { transform: rotate(-3deg) scale(1.02) translateY(0); }
    100% { transform: rotate(3deg) scale(0.98) translateY(-8px); }
  }

  .s2-text {
    position: absolute;
    bottom: 90px;
    left: 0; right: 0;
    text-align: center;
    padding: 0 24px;
  }

  .s2-title {
    font-size: 26px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 20px rgba(6,182,212,0.8), 0 2px 6px rgba(0,0,0,0.9);
    line-height: 1.2;
  }

  .music-notes {
    position: absolute;
    font-size: 28px;
    animation: noteFloat 2s ease-in-out infinite;
    z-index: 4;
  }

  @keyframes noteFloat {
    0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(-120px) rotate(20deg); opacity: 0; }
  }

  /* ══ SCÈNE 3 ══ */
  #s3 { background: radial-gradient(ellipse at 50% 30%, #0d1b4a 0%, #000 80%); }

  .cta-button {
    width: 240px;
    height: 64px;
    background: linear-gradient(135deg, #D4AF37, #FFB347);
    border-radius: 99px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 900;
    color: #0B0B0F;
    box-shadow: 0 0 40px rgba(212,175,55,0.7), 0 0 80px rgba(212,175,55,0.3);
    animation: buttonPulse 1s ease-in-out infinite;
    z-index: 5;
    margin-top: 20px;
    cursor: pointer;
    letter-spacing: 0.5px;
  }

  @keyframes buttonPulse {
    0%,100% { box-shadow: 0 0 30px rgba(212,175,55,0.6), 0 0 60px rgba(212,175,55,0.2); transform: scale(1); }
    50%      { box-shadow: 0 0 60px rgba(212,175,55,1), 0 0 100px rgba(212,175,55,0.5); transform: scale(1.04); }
  }

  .social-icons {
    display: flex;
    gap: 18px;
    margin-top: 24px;
    z-index: 5;
  }

  .social-icon {
    width: 48px; height: 48px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    animation: iconBounce 1.5s ease-in-out infinite;
  }

  .social-icon:nth-child(1) { background: linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045); animation-delay: 0s; }
  .social-icon:nth-child(2) { background: #1877F2; animation-delay: 0.2s; }
  .social-icon:nth-child(3) { background: #000; border: 1px solid #fff3; animation-delay: 0.4s; }

  @keyframes iconBounce {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }

  .mascots-small {
    width: 280px;
    position: absolute;
    bottom: 110px;
    filter: drop-shadow(0 0 16px rgba(124,58,237,0.4));
    animation: float 3s ease-in-out infinite;
  }

  .s3-text {
    position: absolute;
    top: 60px;
    left: 0; right: 0;
    text-align: center;
    padding: 0 20px;
  }

  .s3-title {
    font-size: 24px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 20px rgba(124,58,237,0.8), 0 2px 6px rgba(0,0,0,0.9);
    line-height: 1.2;
  }

  /* ══ SCÈNE 4 ══ */
  #s4 { background: radial-gradient(ellipse at center, #1a0a00 0%, #000 70%); }

  .final-logo-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    animation: epicReveal 1s ease-out forwards;
    z-index: 5;
  }

  @keyframes epicReveal {
    0%   { transform: scale(0.3) rotate(-10deg); opacity: 0; }
    70%  { transform: scale(1.1) rotate(2deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  .final-tour-title {
    font-family: 'Arial Black', sans-serif;
    font-size: 38px;
    font-weight: 900;
    background: linear-gradient(180deg, #fff 0%, #D4AF37 60%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-align: center;
    line-height: 1;
    text-shadow: none;
    filter: drop-shadow(0 0 30px rgba(212,175,55,0.8));
  }

  .final-subtitle {
    font-size: 14px;
    color: rgba(212,175,55,0.7);
    letter-spacing: 3px;
    text-transform: uppercase;
    text-align: center;
  }

  .mascots-final {
    width: 310px;
    position: absolute;
    bottom: 140px;
    animation: epicRevealImg 1.2s 0.3s ease-out both;
    filter: drop-shadow(0 0 30px rgba(212,175,55,0.4));
  }

  @keyframes epicRevealImg {
    0%   { transform: translateY(80px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }

  .partner-logo {
    position: absolute;
    bottom: 28px;
    left: 0; right: 0;
    text-align: center;
    font-size: 11px;
    color: rgba(212,175,55,0.5);
    letter-spacing: 2px;
    text-transform: uppercase;
    z-index: 5;
  }

  .final-cta-text {
    position: absolute;
    top: 60px;
    left: 0; right: 0;
    text-align: center;
    padding: 0 24px;
    z-index: 5;
  }

  .final-cta-words {
    font-size: 19px;
    font-weight: 900;
    color: #fff;
    line-height: 1.35;
    text-shadow: 0 0 20px rgba(212,175,55,0.6), 0 2px 6px rgba(0,0,0,0.9);
  }

  .final-cta-words span { color: #D4AF37; }

  /* ── Progress bar ── */
  #progress {
    position: absolute;
    bottom: 0; left: 0;
    height: 3px;
    background: linear-gradient(90deg, #D4AF37, #06B6D4, #7C3AED);
    z-index: 10;
    transition: width 0.1s linear;
  }

  /* ── Scene indicator ── */
  #dots {
    position: absolute;
    top: 16px;
    right: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 10;
  }

  .dot {
    width: 6px; height: 6px;
    border-radius: 3px;
    background: rgba(255,255,255,0.3);
    transition: all 0.3s;
  }

  .dot.active {
    background: #D4AF37;
    height: 20px;
    box-shadow: 0 0 8px #D4AF37;
  }

  /* ── Bouton replay ── */
  #replay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(212,175,55,0.9);
    color: #000;
    border: none;
    border-radius: 99px;
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    z-index: 20;
    display: none;
    box-shadow: 0 0 30px rgba(212,175,55,0.6);
  }

  /* Burst flash */
  .flash {
    position: absolute;
    inset: 0;
    background: white;
    z-index: 15;
    pointer-events: none;
    animation: flashAnim 0.4s ease-out forwards;
  }

  @keyframes flashAnim {
    0%   { opacity: 0.7; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>

<div id="stage">
  <!-- Canvas particules -->
  <canvas id="bg"></canvas>

  <!-- Progress bar -->
  <div id="progress"></div>

  <!-- Dots -->
  <div id="dots">
    <div class="dot active" id="dot-0"></div>
    <div class="dot" id="dot-1"></div>
    <div class="dot" id="dot-2"></div>
    <div class="dot" id="dot-3"></div>
  </div>

  <!-- ══ SCÈNE 1 : INTRO ══ -->
  <div class="scene active" id="s1">
    <img class="mascots-img" src="https://media.base44.com/images/public/69ff4dc771a2cdab275f8a00/bf4b79208_3C3A31A9-640D-4C3E-BEAB-DCF6D80B87D9.png" alt="Mascottes Dour"/>
    <div class="s1-text">
      <div class="s1-title">Et si la prochaine<br>mascotte de Dour<br>venait de <span>VOUS ?</span></div>
    </div>
  </div>

  <!-- ══ SCÈNE 2 : FESTIVE ══ -->
  <div class="scene" id="s2">
    <div class="confetti-container" id="confetti"></div>
    <!-- Notes de musique -->
    <div class="music-notes" style="left:30px;top:120px;animation-delay:0s;">🎵</div>
    <div class="music-notes" style="right:40px;top:160px;animation-delay:0.7s;">🎶</div>
    <div class="music-notes" style="left:60px;top:200px;animation-delay:1.4s;">🎵</div>
    <div class="music-notes" style="right:30px;top:220px;animation-delay:0.3s;">🎶</div>
    <img class="mascots-dance" src="https://media.base44.com/images/public/69ff4dc771a2cdab275f8a00/bf4b79208_3C3A31A9-640D-4C3E-BEAB-DCF6D80B87D9.png" alt="Mascottes"/>
    <div class="s2-text">
      <div class="s2-title">Votre avis<br>compte vraiment ! 🎉</div>
    </div>
  </div>

  <!-- ══ SCÈNE 3 : CTA ══ -->
  <div class="scene" id="s3">
    <div class="s3-text">
      <div class="s3-title">Cliquez sur le lien<br>et participez ! 👇</div>
    </div>
    <img class="mascots-small" src="https://media.base44.com/images/public/69ff4dc771a2cdab275f8a00/bf4b79208_3C3A31A9-640D-4C3E-BEAB-DCF6D80B87D9.png" alt="Mascottes"/>
    <div style="position:absolute;bottom:260px;display:flex;flex-direction:column;align-items:center;gap:16px;z-index:5;">
      <div class="cta-button">🔗 Participer maintenant</div>
      <div class="social-icons">
        <div class="social-icon">📸</div>
        <div class="social-icon">👍</div>
        <div class="social-icon">🎵</div>
      </div>
    </div>
  </div>

  <!-- ══ SCÈNE 4 : FINAL ══ -->
  <div class="scene" id="s4">
    <div class="final-cta-text">
      <div class="final-cta-words">La future mascotte<br>de Dour commence<br>avec <span>VOUS.</span> ✨</div>
    </div>
    <img class="mascots-final" src="https://media.base44.com/images/public/69ff4dc771a2cdab275f8a00/bf4b79208_3C3A31A9-640D-4C3E-BEAB-DCF6D80B87D9.png" alt="Mascottes"/>
    <div class="final-logo-container" style="position:absolute;bottom:155px;">
      <div class="final-tour-title">Le Tour de Dour</div>
      <div class="final-subtitle">Dour · Belgique</div>
    </div>
    <div class="partner-logo">🔥 Propulsé par Olivier Trevis</div>
  </div>

  <!-- Replay -->
  <button id="replay" onclick="startAnimation()">▶ Rejouer</button>
</div>

<script>
// ── Particules canvas ──
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');
canvas.width = stage.offsetWidth;
canvas.height = stage.offsetHeight;

const COLORS = ['#D4AF37','#06B6D4','#7C3AED','#EC4899','#FFB347','#3B82F6','#fff'];

const particles = Array.from({length: 120}, () => ({
  x: Math.random() * canvas.width,
  y: Math.random() * canvas.height,
  r: Math.random() * 2.5 + 0.5,
  vx: (Math.random() - 0.5) * 0.6,
  vy: (Math.random() - 0.5) * 0.6,
  color: COLORS[Math.floor(Math.random() * COLORS.length)],
  alpha: Math.random() * 0.7 + 0.1,
  pulse: Math.random() * Math.PI * 2,
}));

function animParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    p.pulse += 0.04;
    p.x += p.vx;
    p.y += p.vy;
    if (p.x < 0) p.x = canvas.width;
    if (p.x > canvas.width) p.x = 0;
    if (p.y < 0) p.y = canvas.height;
    if (p.y > canvas.height) p.y = 0;
    const alpha = p.alpha * (0.6 + 0.4 * Math.sin(p.pulse));
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (0.8 + 0.2 * Math.sin(p.pulse)), 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = alpha;
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  requestAnimationFrame(animParticles);
}
animParticles();

// ── Confettis scène 2 ──
function makeConfetti() {
  const c = document.getElementById('confetti');
  c.innerHTML = '';
  for (let i = 0; i < 40; i++) {
    const el = document.createElement('div');
    const color = COLORS[Math.floor(Math.random() * COLORS.length)];
    const size = Math.random() * 10 + 5;
    el.style.cssText = `
      position:absolute;
      left:${Math.random()*100}%;
      top:-20px;
      width:${size}px;
      height:${size}px;
      background:${color};
      border-radius:${Math.random() > 0.5 ? '50%' : '2px'};
      animation: confettiFall ${Math.random()*2+1.5}s ${Math.random()*2}s ease-in infinite;
      opacity:0.85;
    `;
    c.appendChild(el);
  }
}

const style = document.createElement('style');
style.textContent = `
@keyframes confettiFall {
  0%   { transform: translateY(-20px) rotate(0deg); opacity:1; }
  100% { transform: translateY(720px) rotate(${Math.random()*720}deg); opacity:0; }
}`;
document.head.appendChild(style);

// ── Gestion des scènes ──
const scenes = ['s1','s2','s3','s4'];
const durations = [3000, 3500, 3500, 4000]; // ms par scène
let currentScene = 0;
let sceneTimer = null;
let progressTimer = null;
let startTime = null;
let totalDuration = durations.reduce((a,b) => a+b, 0);

function showScene(idx) {
  scenes.forEach((id, i) => {
    document.getElementById(id).classList.toggle('active', i === idx);
    document.getElementById('dot-'+i).classList.toggle('active', i === idx);
  });

  // Flash de transition
  if (idx > 0) {
    const flash = document.createElement('div');
    flash.className = 'flash';
    stage.appendChild(flash);
    setTimeout(() => flash.remove(), 400);
  }

  if (idx === 1) makeConfetti();
}

function updateProgress() {
  const elapsed = Date.now() - startTime;
  const pct = Math.min((elapsed / totalDuration) * 100, 100);
  document.getElementById('progress').style.width = pct + '%';
}

function startAnimation() {
  currentScene = 0;
  startTime = Date.now();
  document.getElementById('replay').style.display = 'none';
  showScene(0);

  let cumulative = 0;
  durations.forEach((dur, i) => {
    setTimeout(() => {
      if (i < scenes.length - 1) showScene(i + 1);
      else {
        // Fin
        setTimeout(() => {
          document.getElementById('replay').style.display = 'block';
        }, dur);
      }
    }, cumulative + (i === 0 ? 0 : durations[i-1]));
    cumulative += dur;
  });

  // Pas propre mais fonctionnel : recalcul
  let cum = 0;
  const timeouts = [];
  for (let i = 0; i < scenes.length; i++) {
    (function(idx, delay) {
      setTimeout(() => showScene(idx), delay);
    })(i, cum);
    cum += durations[i];
  }

  // Progress bar
  clearInterval(progressTimer);
  progressTimer = setInterval(() => {
    updateProgress();
    if (Date.now() - startTime >= totalDuration) clearInterval(progressTimer);
  }, 50);
}

// Lancement auto
startAnimation();
</script>
</body>
</html>
