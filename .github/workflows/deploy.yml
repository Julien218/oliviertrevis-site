name: 🚀 CI/CD — Olivier Trevis (Railway)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    name: 🚀 Deploy to Railway
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🏗️ Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: 🚀 Install Railway CLI
        run: npm install -g @railway/cli

      - name: 🚀 Deploy to Railway
        run: railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: ✅ Done
        run: echo "✨ oliviertrevis.be déployé via Railway — JS-Innov.IA"
